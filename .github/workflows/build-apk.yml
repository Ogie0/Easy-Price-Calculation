name: Android-APK bauen

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

# Standard: nur lesen. Schreibrechte bekommt allein der Release-Job.
permissions:
  contents: read

# Alle Läufe veröffentlichen dasselbe Release "apk-latest"; ein neuer Lauf
# bricht einen älteren ab, damit sie sich nicht in die Quere kommen.
concurrency:
  group: apk-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.label }}
      permanent: ${{ steps.signing.outputs.permanent }}
      sha256: ${{ steps.signature.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Feste Flutter-Version, damit Builds reproduzierbar bleiben. Zum
      # Aktualisieren hier und lokal dieselbe Version verwenden.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

      # Fester Schlüssel aus den Secrets, damit sich die App per Update
      # installieren lässt. Ohne Secrets gibt es einen Wegwerf-Schlüssel.
      - name: Signaturschlüssel einrichten
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/upload-keystore.p12"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt (Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD). Die APK bekommt einen Wegwerf-Schlüssel und lässt sich nicht über eine bestehende Installation aktualisieren."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wegwerf-Schluessel"
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # Versionsname aus pubspec.yaml, Build-Nummer = Nummer dieses Laufs
      # (steigt immer, damit Android jede neue APK als Update erkennt).
      - name: Version bestimmen
        id: version
        run: |
          NAME="$(sed -nE 's/^version: *([^+ ]+).*/\1/p' pubspec.yaml)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "label=$NAME (Build $GITHUB_RUN_NUMBER)" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.label }}"
          cp build/app/outputs/flutter-apk/app-release.apk Knuelle-Kalkulieren-JGC.apk

      - name: Signatur prüfen
        id: signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs Knuelle-Kalkulieren-JGC.apk | tee signature.txt
          echo "sha256=$(grep -m1 'SHA-256 digest' signature.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: Knuelle-Kalkulieren-JGC-apk
          path: Knuelle-Kalkulieren-JGC.apk

  # Stellt die neueste APK unter "Releases" bereit, damit sie direkt auf dem
  # Smartphone heruntergeladen werden kann.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Knuelle-Kalkulieren-JGC-apk

      - name: Release "apk-latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PERMANENT: ${{ needs.build.outputs.permanent }}
          FINGERPRINT: ${{ needs.build.outputs.sha256 }}
        run: |
          if [ "$PERMANENT" = "true" ]; then
            SIGNING="Signiert mit dem festen Schlüssel: Updates über die bestehende Installation funktionieren."
          else
            SIGNING="⚠️ Ohne festen Schlüssel signiert: Diese APK lässt sich nicht über eine bestehende Installation aktualisieren."
          fi
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest Knuelle-Kalkulieren-JGC.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Knülle Kalkulieren - JGC $VERSION" \
            --notes "Version $VERSION, automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Auf dem Smartphone herunterladen und installieren.

          ${SIGNING}
          Zertifikat (SHA-256): ${FINGERPRINT}"
