name: easy_price_calculation
description: Offline-Kassen-App für ein Vereinsfest.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  archive: ^4.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.12.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  web: ^1.1.2
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  qr: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/jgc_logo.png
    - assets/articles/
    - assets/fonts/Roboto_LICENSE.txt
    - assets/licenses/zxing-js_LICENSE.txt

  # Roboto mitliefern: Im Browser (iPhone) würde Flutter sie sonst aus dem
  # Internet laden – offline gäbe es dann keine Schrift.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# App-Icon: nach Änderungen an assets/icon/ neu erzeugen mit
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true

# Startbildschirm mit Vereinslogo: nach Änderungen neu erzeugen mit
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1511"
  image: assets/logo/jgc_logo.png
  android_12:
    image: assets/icon/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#0F1511"
  ios: true
  web: false
